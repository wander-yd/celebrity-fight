<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="A cartoon dollar-stack roguelite with three arenas, chasing bosses and synergistic builds.">
    <title>The Donald — Void Arena</title>
    <link rel="stylesheet" href="styles.css?v=36">
  </head>
  <body>
    <main>
      <div class="layout">
        <section id="game-stage" class="gamewrap" aria-label="Arena game">
          <div id="arena-toolbar" class="arena-toolbar">
            <div class="arena-vitals">
              <div id="health" aria-label="Health"></div>
              <div id="equipped" aria-label="Equipped items"></div>
            </div>
            <nav class="arena-actions" aria-label="Game menu">
              <button id="pause" class="small icon-button" aria-label="Pause or resume" title="Pause or resume"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M8 5v14M16 5v14" stroke-width="4"/></svg></button>
              <button id="debug-open" class="small" aria-label="Open Debug and Codex"><span aria-hidden="true">☷</span><span class="action-word"> CODEX</span></button>
            </nav>
            <div class="arena-progress"><span id="chapter-label"></span><span id="wave-label"></span></div>
            <div id="arena-instruction" class="arena-instruction" hidden></div>
          </div>
          <div id="arena-viewport" class="arena-viewport">
            <canvas id="game" width="728" height="728" tabindex="0" aria-label="Use WASD to move, mouse to aim and swing a dollar stack, Space to dodge-jump, P to pause"></canvas>
          </div>
          <div id="boss-panel" class="boss-panel">
            <div class="boss-info">
              <div id="boss-label"></div>
              <div id="boss-meter" class="boss-meter" role="progressbar" aria-label="Boss health" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100" hidden><i id="boss-fill"></i></div>
            </div>
            <button class="touch" id="jump" aria-label="Jump ready">JUMP</button>
          </div>
          <div id="arena-message" class="arena-message" hidden></div>
          <div id="arena-prompt" class="arena-prompt" hidden></div>
          <div id="overlay" class="overlay"></div>
          <div class="sr-only"><span id="jumptext"></span><span id="debug-status" role="status" hidden>Infinite hearts enabled</span></div>
        </section>
      </div>
    </main>
    <dialog id="debug-window" class="debug-window" aria-labelledby="debug-title">
      <header class="debug-header">
        <div>
          <div class="codex-eyebrow">THE DONALD / FIELD MANUAL</div>
          <h2 id="debug-title">Debug &amp; Codex</h2>
          <p>Combat pauses while this window is open.</p>
        </div>
        <button type="button" id="debug-close" class="icon-button" aria-label="Close Debug and Codex" title="Close Debug and Codex"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
      </header>
      <div id="debug-body" class="debug-body"></div>
    </dialog>
    <script src="core.js?v=36"></script>
    <script src="timing.js?v=36"></script>
    <script src="camera.js?v=36"></script>
    <script src="state.js?v=36"></script>
    <script src="render.js?v=36"></script>
    <script src="ui.js?v=36"></script>
    <script src="releases.js?v=36"></script>
    <script src="debug.js?v=36"></script>
    <script src="input.js?v=36"></script>
    <script src="game.js?v=36"></script>
  </body>
</html>
